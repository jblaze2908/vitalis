; Optional: Vitalis under scale0 (github.com/jblaze2908/scale0), whose deployer builds, backs up, rolls out and
; health-checks each push to main. `health` is the address scale0 holds, which also wakes the app. Unused without it.
[app]
compose = deploy/compose.yml
project = vitalis
env_file = /etc/vitalis/vitalis.env
branch = main
key =
health = http://172.17.0.1:8370/health
backup = command:deploy/backup.sh
notify = NTFY_URL NTFY_TOKEN

[service.app]
mode = sleep
scale0 = vitalis
